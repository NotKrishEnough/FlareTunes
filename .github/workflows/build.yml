name: Build FlareTunes
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
      - run: flutter create . --platforms=android --project-name flare_tunes
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: flare-tunes-release
          path: build/app/outputs/flutter-apk/app-release.apk
